<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">AI Timing OpenAPI onboarding flow</title>
  <desc id="desc">Register, create credentials, sign GET requests, and receive structured data</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/></marker>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="54" y="50" fill="#0e7490" font-size="14" font-weight="700" letter-spacing="3">OPEN API / QUICK START</text>
    <text x="54" y="86" fill="#0f172a" font-size="26" font-weight="800">注册一次，按规范签名，即可接入数据能力</text>
    <g fill="#fff" stroke="#bae6fd" stroke-width="2">
      <rect x="54" y="132" width="210" height="126" rx="18"/><rect x="342" y="132" width="210" height="126" rx="18"/><rect x="630" y="132" width="210" height="126" rx="18"/><rect x="918" y="132" width="228" height="126" rx="18"/>
    </g>
    <g fill="none" stroke="#0891b2" stroke-width="4" marker-end="url(#arrow)"><path d="M274 195 H328"/><path d="M562 195 H616"/><path d="M850 195 H904"/></g>
    <g fill="#0f172a">
      <text x="82" y="170" font-size="13" fill="#0284c7" font-weight="700">01 / ACCOUNT</text><text x="82" y="207" font-size="20" font-weight="800">平台注册</text><text x="82" y="234" font-size="13" fill="#64748b">创建登录账号</text>
      <text x="370" y="170" font-size="13" fill="#0284c7" font-weight="700">02 / CREDENTIAL</text><text x="370" y="207" font-size="20" font-weight="800">申请 AK / SK</text><text x="370" y="234" font-size="13" fill="#64748b">SK 仅展示一次</text>
      <text x="658" y="170" font-size="13" fill="#0284c7" font-weight="700">03 / SIGN</text><text x="658" y="207" font-size="20" font-weight="800">服务端签名</text><text x="658" y="234" font-size="13" fill="#64748b">GET + HMAC-SHA256</text>
      <text x="946" y="170" font-size="13" fill="#0284c7" font-weight="700">04 / RESPONSE</text><text x="946" y="207" font-size="20" font-weight="800">获取结构化数据</text><text x="946" y="234" font-size="13" fill="#64748b">按权限与额度调用</text>
    </g>
  </g>
</svg>
