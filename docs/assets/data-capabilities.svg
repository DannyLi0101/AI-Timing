<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">AI Timing daily AI data</title>
  <desc id="desc">AI papers, people, institutions, news, social posts, and open-source information updated daily</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102d45"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="58" y="58" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="4">AI TIMING / DAILY AI DATA</text>
    <text x="58" y="102" fill="#f8fafc" font-size="30" font-weight="800">每日更新，覆盖 AI 领域重要公开数据</text>
    <g filter="url(#shadow)">
      <rect x="58" y="154" width="190" height="190" rx="20" fill="#0e2032" stroke="#1e4862"/>
      <text x="82" y="193" fill="#67e8f9" font-size="13" font-weight="700">DAILY COVERAGE</text>
      <text x="82" y="231" fill="#fff" font-size="19" font-weight="700">论文与作者</text>
      <text x="82" y="261" fill="#fff" font-size="19" font-weight="700">新闻与机构</text>
      <text x="82" y="291" fill="#fff" font-size="19" font-weight="700">社交与开源</text>
      <text x="82" y="321" fill="#94a3b8" font-size="13">每日更新 · 清洗整理</text>
    </g>
    <path d="M270 249 C330 249 330 249 390 249" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="330" cy="249" r="7" fill="#22d3ee"/>
    <g filter="url(#shadow)">
      <rect x="410" y="154" width="320" height="190" rx="20" fill="#101d31" stroke="#335879"/>
      <text x="438" y="193" fill="#a5b4fc" font-size="13" font-weight="700">AI DATA, UPDATED DAILY</text>
      <text x="438" y="235" fill="#fff" font-size="21" font-weight="800">每天可获取的 AI 数据</text>
      <text x="438" y="266" fill="#cbd5e1" font-size="15">论文 · 作者 · 机构 · 资讯 · 社交 · 开源</text>
      <text x="438" y="295" fill="#cbd5e1" font-size="15">清洗整理 · 关联查询 · API 获取</text>
      <rect x="438" y="313" width="112" height="9" rx="4.5" fill="#22d3ee"/><rect x="560" y="313" width="82" height="9" rx="4.5" fill="#8b5cf6"/><rect x="652" y="313" width="50" height="9" rx="4.5" fill="#34d399"/>
    </g>
    <path d="M752 249 C812 249 812 249 872 249" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="812" cy="249" r="7" fill="#a78bfa"/>
    <g filter="url(#shadow)">
      <rect x="892" y="124" width="250" height="250" rx="20" fill="#f8fafc"/>
      <text x="920" y="166" fill="#2563eb" font-size="13" font-weight="700">AVAILABLE TO USE</text>
      <text x="920" y="207" fill="#0f172a" font-size="19" font-weight="800">页面查询</text>
      <text x="920" y="245" fill="#0f172a" font-size="19" font-weight="800">API 调用</text>
      <text x="920" y="283" fill="#0f172a" font-size="19" font-weight="800">定期汇总</text>
      <text x="920" y="321" fill="#0f172a" font-size="19" font-weight="800">系统集成</text>
      <text x="920" y="350" fill="#64748b" font-size="13">日报 / 周报 / 月报 / API</text>
    </g>
  </g>
</svg>
